# Compila el APK de TeXsting en cada cambio y lo publica en "Releases"
# para descargarlo directo desde el teléfono.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versión
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir la app web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1b2540' --iconBackgroundColorDark '#1b2540' --splashBackgroundColor '#18213a' --splashBackgroundColorDark '#18213a'

      - name: Íconos en la resolución correcta (los del repositorio reemplazan a los generados)
        run: cp -r android-config/res/. android/app/src/main/res/
      - name: Sincronizar
        run: npx cap sync android

      # Motor integrado (experimental, #1): pdftex de Termux + TeX Live mínimo dentro del APK.
      - uses: actions/cache@v4
        id: motorcache
        with:
          path: motor-out/paquete
          key: motor-${{ hashFiles('tools/motor/**') }}
      - name: Armar el motor integrado
        if: steps.motorcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace patchelf
          python3 tools/motor/empaquetar.py motor-out/paquete
      - name: Poner el motor en el proyecto Android
        run: |
          if [ -f motor-out/paquete/assets/motor/tl.zip ]; then
            mkdir -p android/app/src/main/jniLibs android/app/src/main/assets
            cp -r motor-out/paquete/jniLibs/. android/app/src/main/jniLibs/
            cp -r motor-out/paquete/assets/. android/app/src/main/assets/
            cat motor-out/paquete/assets/motor/version.txt
          else
            echo "::warning::El APK sale sin motor integrado"
          fi
      - name: Achicar el motor (datos de ICU) y alinear a 16 KB
        run: |
          L=android/app/src/main/jniLibs/arm64-v8a
          if [ -f $L/libtx_icudata.so ]; then
            python3 tools/apk/recortar_icu.py $L/libtx_icudata.so || echo "::warning::No se pudieron recortar los datos de ICU"
          fi
          if [ -f $L/libandroid-complex-math.so ]; then
            bash tools/apk/complex_math.sh /tmp/libandroid-complex-math.so && cp /tmp/libandroid-complex-math.so $L/ || echo "::warning::No se pudo rearmar libandroid-complex-math"
          fi
          # Google Play pide páginas de 16 KB en todas las librerías.
          for f in $L/*.so; do
            a=$(readelf -lW $f | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            case "$a" in *0x1000\ *|*0x2000\ *) echo "::warning::$(basename $f) no está alineada a 16 KB ($a)";; esac
          done
          du -sh $L

      - name: Compilar APK
        run: |
          # Llave fija para que cada versión nueva se instale encima de la anterior
          # (sin perder tus proyectos).
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TeXsting.apk

      - name: Notas de la versión
        run: node scripts/release-notes.mjs release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: TeXsting-apk
          path: TeXsting.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TeXsting ${{ env.APP_VERSION }} (compilación ${{ github.run_number }})
          prerelease: true
          files: TeXsting.apk
          body_path: release-notes.md
