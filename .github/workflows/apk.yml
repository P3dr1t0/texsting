# Compila el APK de TeXsting en cada cambio y lo publica en "Releases"
# para descargarlo directo desde el teléfono.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versión
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Construir la app web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1f2a44' --iconBackgroundColorDark '#1f2a44' --splashBackgroundColor '#f7f5ef' --splashBackgroundColorDark '#12141a'

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          # Llave fija para que cada versión nueva se instale encima de la anterior
          # (sin perder tus proyectos).
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TeXsting.apk

      - name: Notas de la versión
        run: node scripts/release-notes.mjs release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: TeXsting-apk
          path: TeXsting.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TeXsting ${{ env.APP_VERSION }} (compilación ${{ github.run_number }})
          prerelease: true
          files: TeXsting.apk
          body_path: release-notes.md
