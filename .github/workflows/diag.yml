name: Diagnóstico TeX (manual)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live 2026 (tlnet, como el motor integrado)
        run: |
          cd /tmp && curl -sL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz && cd install-tl-2*
          printf "selected_scheme scheme-medium\nTEXDIR /tmp/tl\nTEXMFLOCAL /tmp/tl/texmf-local\nTEXMFSYSVAR /tmp/tl/texmf-var\nTEXMFSYSCONFIG /tmp/tl/texmf-config\nTEXMFVAR /tmp/tl/texmf-var\nTEXMFHOME /tmp/tl/home\nbinary_x86_64-linux 1\ninstopt_adjustpath 0\ntlpdbopt_install_docfiles 0\ntlpdbopt_install_srcfiles 0\n" > p.txt
          ./install-tl -profile p.txt -no-interaction > /dev/null
          /tmp/tl/bin/x86_64-linux/tlmgr install biblatex biblatex-ieee logreq mylatexformat cm-super esint esint-type1 cancel tcolorbox pgfplots titlesec fancyhdr float enumitem tikzfill pdfcol listingsutf8 environ trimspaces fancybox > /dev/null || true
          /tmp/tl/bin/x86_64-linux/tex --version | head -1
      - name: Probar
        shell: bash {0}
        run: |
          export PATH=/tmp/tl/bin/x86_64-linux:$PATH
          cd tools/diag
          ./bib.sh
