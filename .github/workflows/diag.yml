name: Diagnóstico TeX (manual)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-extra texlive-lang-spanish texlive-pictures cm-super > /dev/null
      - name: Probar
        shell: bash {0}
        run: |
          curl -sI https://mirror.ctan.org/fonts/ps-type1/cm-super/pfb/sfrm1095.pfb | head -5
          curl -sL -o /tmp/x.pfb https://mirror.ctan.org/fonts/ps-type1/cm-super/pfb/sfrm1095.pfb; ls -la /tmp/x.pfb; head -c 40 /tmp/x.pfb | od -c | head -2
          cd tools/diag
          b=cuaderno
          t0=$(date +%s.%N); pdflatex -interaction=nonstopmode $b.tex > /dev/null; echo "== normal: $(grep -c '^!' $b.log) errores, $(echo "$(date +%s.%N)-$t0"|bc) s"; grep -A8 "^!" $b.log | head -40
          grep -c "Font shape" $b.log
