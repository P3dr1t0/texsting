name: Diagnóstico TeX (manual)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live 2026 (tlnet, como el motor integrado)
        run: |
          cd /tmp && curl -sL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz && cd install-tl-2*
          printf "selected_scheme scheme-basic\nTEXDIR /tmp/tl\nTEXMFLOCAL /tmp/tl/texmf-local\nTEXMFSYSVAR /tmp/tl/texmf-var\nTEXMFSYSCONFIG /tmp/tl/texmf-config\nTEXMFVAR /tmp/tl/texmf-var\nTEXMFHOME /tmp/tl/home\nbinary_x86_64-linux 1\ninstopt_adjustpath 0\ntlpdbopt_install_docfiles 0\ntlpdbopt_install_srcfiles 0\n" > p.txt
          ./install-tl -profile p.txt -no-interaction > /dev/null
          /tmp/tl/bin/x86_64-linux/tlmgr install babel-spanish hyphen-spanish pgf fancybox titlesec enumitem geometry mylatexformat cm-super xcolor amsmath tools ec hyperref > /dev/null || true
          /tmp/tl/bin/x86_64-linux/tex --version | head -1
      - name: Probar
        shell: bash {0}
        run: |
          export PATH=/tmp/tl/bin/x86_64-linux:$PATH
          cd tools/diag
          b=cuaderno
          T(){ t0=$(date +%s.%N); "$@" > /dev/null 2>&1; echo "$(echo "$(date +%s.%N)-$t0"|bc)"; }
          echo "== normal: $(T pdflatex -interaction=nonstopmode -file-line-error $b.tex) s, $(grep -c '^!\|:[0-9]*: ' $b.log) err"; grep -A8 "^!\|:[0-9]*: " $b.log | head -40
          echo "== armar pre: $(T pdftex -ini -interaction=nonstopmode -jobname=texsting-pre '&pdflatex' mylatexformat.ltx $b.tex) s, $(grep -c '^!' texsting-pre.log) err"
          echo "== con pre: $(T pdflatex -fmt=texsting-pre -interaction=nonstopmode -file-line-error $b.tex) s"; grep -A8 "^!\|:[0-9]*: " $b.log | head -40
          INJ='\AddToHook{begindocument/before}{\IfPackageLoadedTF{tikz}{\usetikzlibrary{external}\tikzexternalize[mode=list and make,prefix=texsting-fig/]}{}}'
          mkdir -p texsting-fig
          echo "== lista: $(T pdflatex -interaction=nonstopmode -file-line-error -jobname=$b "${INJ}\input{$b.tex}") s"; grep -A8 "^!\|:[0-9]*: " $b.log | grep -v "tikz Warning" | head -30
          for f in $(cat $b.figlist); do pdflatex -interaction=batchmode -halt-on-error -jobname="$f" "${INJ}\def\tikzexternalrealjob{$b}\input{$b.tex}" > /dev/null 2>&1; [ -f "$f.pdf" ] || { echo "-- falló $f"; grep -A6 "^!" $f.log | head -10; }; done
          echo "== con figuras: $(T pdflatex -interaction=nonstopmode -file-line-error -jobname=$b "${INJ}\input{$b.tex}") s"; grep -A8 "^!\|:[0-9]*: " $b.log | head -30
