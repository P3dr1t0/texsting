name: Diagnóstico TeX (manual)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq texlive-latex-extra texlive-lang-spanish texlive-pictures > /dev/null
      - name: Probar
        run: |
          cd tools/motor/diag
          for b in ul; do
            pdflatex -interaction=nonstopmode $b.tex > /dev/null; echo "== $b normal"; grep -A6 "^!" $b.log | head -30
            sed 's/es-noshorthands,//' $b.tex > ${b}2.tex; pdflatex -interaction=nonstopmode ${b}2.tex > /dev/null; echo "== $b sin noshorthands"; grep -A3 "^!" ${b}2.log | head -12
            sed 's/\\underline{Son funciones}/Son funciones/' $b.tex > ${b}3.tex; pdflatex -interaction=nonstopmode ${b}3.tex > /dev/null; echo "== $b sin underline"; grep -A3 "^!" ${b}3.log | head -12
            sed 's/\\usepackage{fancybox}//' $b.tex > ${b}4.tex; pdflatex -interaction=nonstopmode ${b}4.tex > /dev/null; echo "== $b sin fancybox"; grep -A3 "^!" ${b}4.log | head -12
          done
