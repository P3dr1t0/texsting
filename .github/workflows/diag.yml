name: Diagnóstico TeX (manual)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live 2026 (tlnet, como el motor integrado)
        run: |
          cd /tmp && curl -sL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz && cd install-tl-2*
          printf "selected_scheme scheme-basic\nTEXDIR /tmp/tl\nTEXMFLOCAL /tmp/tl/texmf-local\nTEXMFSYSVAR /tmp/tl/texmf-var\nTEXMFSYSCONFIG /tmp/tl/texmf-config\nTEXMFVAR /tmp/tl/texmf-var\nTEXMFHOME /tmp/tl/home\nbinary_x86_64-linux 1\ninstopt_adjustpath 0\ntlpdbopt_install_docfiles 0\ntlpdbopt_install_srcfiles 0\n" > p.txt
          ./install-tl -profile p.txt -no-interaction > /dev/null
          /tmp/tl/bin/x86_64-linux/tlmgr install babel-spanish hyphen-spanish pgf fancybox titlesec enumitem geometry mylatexformat cm-super xcolor amsmath tools ec hyperref > /dev/null || true
          /tmp/tl/bin/x86_64-linux/tex --version | head -1
      - name: Probar
        shell: bash {0}
        run: |
          export PATH=/tmp/tl/bin/x86_64-linux:$PATH
          cd tools/diag
          for f in y*_*.tex; do b=${f%.tex}; pdflatex -interaction=nonstopmode $f > /dev/null 2>&1; echo "== $b: $(grep -c '^!' $b.log) errores"; grep "^l\.[0-9]" $b.log | head -2; done
          sed -n "17020,17040p" /tmp/tl/texmf-dist/tex/latex/base/latex.ltx; grep -n "underline" /tmp/tl/texmf-dist/tex/latex/fancybox/fancybox.sty /tmp/tl/texmf-dist/tex/latex/hyperref/hyperref.sty | head
