name: Motor integrado — paquete de prueba (#1)
on:
  workflow_dispatch:
jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq strace patchelf
      - name: Armar el motor (binario de Termux + TeX Live mínimo) y probarlo
        run: python3 tools/motor/empaquetar.py motor-out/paquete 2>&1 | tee informe.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-paquete
          path: |
            informe.txt
            motor-out/paquete
