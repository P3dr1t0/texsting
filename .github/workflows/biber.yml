name: Biber para Android (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  biber:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live 2026 (para el biblatex y el .bcf de prueba)
        run: |
          cd /tmp && for m in https://mirror.ctan.org https://mirrors.mit.edu/CTAN https://mirrors.rit.edu/CTAN; do curl -sfL $m/systems/texlive/tlnet/install-tl-unx.tar.gz -o itl.tgz && tar xzf itl.tgz && break; sleep 5; done; cd install-tl-2*
          printf "selected_scheme scheme-basic\nTEXDIR /tmp/tl\nTEXMFLOCAL /tmp/tl/texmf-local\nTEXMFSYSVAR /tmp/tl/texmf-var\nTEXMFSYSCONFIG /tmp/tl/texmf-config\nTEXMFVAR /tmp/tl/texmf-var\nTEXMFHOME /tmp/tl/home\nbinary_aarch64-linux 1\ninstopt_adjustpath 0\ntlpdbopt_install_docfiles 0\ntlpdbopt_install_srcfiles 0\n" > p.txt
          ./install-tl -profile p.txt -no-interaction > /dev/null
          /tmp/tl/bin/aarch64-linux/tlmgr install biblatex biblatex-ieee biber logreq etoolbox kvoptions pdftexcmds xstring > /dev/null
          /tmp/tl/bin/aarch64-linux/biber --version
      - name: .bcf de prueba (y .bbl de referencia con el biber oficial)
        run: |
          export PATH=/tmp/tl/bin/aarch64-linux:$PATH
          mkdir -p /tmp/prueba && cp tools/biber/prueba.tex /tmp/prueba/b.tex && cp tools/biber/refs.bib /tmp/prueba/
          cd /tmp/prueba && pdflatex -interaction=nonstopmode b > /dev/null; ls
          mkdir ref && cp b.bcf refs.bib ref/ && (cd ref && biber b > /dev/null && grep -c 'entry{' b.bbl || true)
          biber --version | grep -o '[0-9][0-9.]*' | head -1 > /tmp/biber-ver; cat /tmp/biber-ver
      - name: Biber en Termux (aarch64)
        run: |
          VER=$(cat /tmp/biber-ver)
          mkdir -p /tmp/salida && chmod 777 /tmp/salida /tmp/prueba
          docker run --rm --privileged -v $PWD/tools/biber:/scripts -v /tmp/prueba:/prueba -v /tmp/salida:/salida termux/termux-docker:aarch64 \
            bash /scripts/dentro.sh "$VER" > /tmp/salida/dentro.log 2>&1 || true
          sed -n '/BIBER-INICIO/,/BIBER-FIN/p' /tmp/salida/dentro.log | head -120
          grep -n "FAIL\|Can't locate\|exit 1" /tmp/salida/dentro.log | head -30
          ls -la /tmp/salida; cat /tmp/salida/needed.txt /tmp/salida/tamanos.txt || true
          diff <(grep -v '^%' /tmp/prueba/ref/b.bbl) <(grep -v '^%' /tmp/prueba/b.bbl) && echo "BBL IGUAL AL OFICIAL" || echo "BBL DISTINTO"
      - name: Empaquetar para el APK y probarlo como en el teléfono
        run: |
          sudo apt-get install -y -qq patchelf > /dev/null; sudo chmod -R a+rwX /tmp/salida
          python3 tools/biber/empaquetar.py /tmp/salida /tmp/biber-apk
          ls -laS /tmp/biber-apk/jniLibs/arm64-v8a | head -12; ls /tmp/biber-apk/jniLibs/arm64-v8a | wc -l
          for f in /tmp/biber-apk/jniLibs/arm64-v8a/*.so; do a=$(readelf -lW $f | awk '$1=="LOAD"{print $NF}' | sort -u | tr "\n" " "); case "$a" in *0x1000\ *|*0x2000\ *) echo "NO ALINEADA $(basename $f) $a";; esac; done
          tar -C /tmp/biber-apk -cJf /tmp/biber-android.tar.xz jniLibs assets
          ls -la /tmp/biber-android.tar.xz
      - name: Prueba como en la app (sin la carpeta de Termux, con los nombres de jniLibs)
        run: |
          mkdir -p /tmp/app && cp -r /tmp/biber-apk/jniLibs/arm64-v8a /tmp/app/lib && cp /tmp/biber-apk/assets/motor/perl.zip /tmp/app/
          chmod -R 777 /tmp/app; cp tools/biber/probar_app.sh /tmp/app/
          rm -f /tmp/prueba/b.bbl
          docker run --rm --privileged -v /tmp/app:/app -v /tmp/prueba:/prueba termux/termux-docker:aarch64 bash /app/probar_app.sh 2>&1 | tail -40
          diff <(grep -v '^%' /tmp/prueba/ref/b.bbl) <(grep -v '^%' /tmp/prueba/b.bbl) && echo "APP: BBL IGUAL AL OFICIAL" || echo "APP: BBL DISTINTO"
      - name: Publicar (release biber-android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat /tmp/biber-ver)
          gh release view biber-android -R ${{ github.repository }} > /dev/null 2>&1 || gh release create biber-android -R ${{ github.repository }} --title "Biber para el motor integrado" --notes "Biber $VER compilado con el Perl de Termux (aarch64), listo para el APK. Lo arma .github/workflows/biber.yml." --prerelease
          gh release upload biber-android /tmp/biber-android.tar.xz --clobber -R ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: biber-termux
          path: /tmp/salida
